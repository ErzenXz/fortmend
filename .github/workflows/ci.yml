name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/fortmend

  linux-root:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: true
      - run: python3 scripts/test-install.py
      - run: go test -race ./...
      # Compile as the runner user; execute privilege/path/rename tests as root.
      # Package-update integration remains explicitly opt-in and is not run here.
      - name: Linux root adapters and full-control protocol
        shell: bash
        run: |
          set -euo pipefail
          for package in codexapp monitor remediation protection; do
            go test -c -o "$RUNNER_TEMP/fortmend-$package.test" "./internal/$package"
            sudo "$RUNNER_TEMP/fortmend-$package.test" -test.v -test.timeout=2m
            rm "$RUNNER_TEMP/fortmend-$package.test"
          done

  fx-linux-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: third_party/fx
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check src/
      - run: zig build -Doptimize=ReleaseSafe
      - run: python3 ../../scripts/test-fx-profile.py ./zig-out/bin/fx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fortmend-fx-${{ matrix.os }}
          path: third_party/fx/zig-out/bin/fx
          retention-days: 1
